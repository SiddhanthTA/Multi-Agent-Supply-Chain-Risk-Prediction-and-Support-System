name: SupplySentry CI

on:
  push:
    branches:
      - main
      - feature/risk-investigation-agent-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend investigation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET_KEY: ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      INVESTIGATION_LOCAL_FILES_ONLY: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi SQLAlchemy pydantic pydantic-settings python-dotenv python-jose bcrypt httpx

      - name: Run investigation agent tests
        run: python -m pytest -q test_investigation_agent.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
